name: Vanti Analytics
description: Vanti Analytics was an Israeli adaptive-AI-for-manufacturing company backed by Insight
  Partners, offering AI-based defect detection, early fault prediction, predictive quality, and
  process tuning across production lines via a hosted application (app.vanti-analytics.com). The
  company published no public API, OpenAPI spec, SDKs, or developer program, and as of 2026-07-21
  it has no live web presence - vanti-analytics.com has lapsed and is parked by a third party,
  vanti.ai is for sale, and the former app/support/docs subdomains no longer resolve.
